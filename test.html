<!DOCTYPE html>
<html lang="id">
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device">
	<title>tugas harian anak nolep</title>
	<style>
		:root {
			--primary:#4f46e5;
			--primary-hover: #4338ca;
			--bg: #f3f4f6;
			--card: #ffffff;
			--text: #4ecad3;
			--muted: #6b7280;
			--danger: #ef4444;
			--success: #10b691;

		}

		{
			box-sizing: border-box;
			margin: 0;
			padding: 0;
			font-family: 'segoe UI', Tahoma, Geneva, verdana, sans-serif;

		}

		body {
			background-color: var(--bg);
			color: var(--text);
			display: flex;
			justify-content: center;
			padding: 40px 20px;
			min-height: 100vh;
		}

		.container {
			background: var(--card);
			width: 100%;
			max-width: 480px;
			border-radius: 16px;
			box-shadow: 0 10px 25px rgba(0, 0, 0, 0.08);
			padding: 28px;
			}

			.timer-box {
				background: linear-gradient(135deg, var(--primary), #6366f10);
				color: white;
				padding: 20px;
				border-radius: 12px;
				text-align: center;
				margin-bottom: 24px;
				}	

			.timer-display {
				font-size: 3rem;
				font-weight: bold;
				letter-spacing: 2px;
				margin: 8px 0;
			}	

			.timer-control button {
				background: rgba(255, 255, 255, 0.2);
				border: none;
				color: white;
				padding: 8px 16px;
				border-radius: 8px;
				cursor: pointer;
				font-weight: 600;
				margin: 0 4px;
				transition: background 0.2s;
			}

			.timer-contols button:hover {
				background: rgba(255, 255, 255, 0.35);
			}

			h2 {
				font-size: 1.25rem;
				margin-bottom: 16px;
			}

			.input-group {
				display: flex;
				gap: 8px;
				margin-bottom: 16px;
			}

			input[type="text"] {
				flex: 1;
				padding: 10px 14px;
				border: 2px solid #e5e7eb;
				border-radius: 8px;
				font-size: 0.95rem;
				outline: none;
				transition: border-color 0.2s;
			}

			input[type="text"]:focus {
				border-color: var(--primary);
			}

			.btn-add {
				background: var(--primary);
				color: white;
				border: none;
				padding: 0 18px;
				border-radius: 8px;
				font-weight: 600;
				cursor: pointer;
				transition: background 0.2s;
			}

			.btn-add:hover {
				background: var(--primary);
			}

			.filters {
				display: flex;
				gap: 8px;
				margin-bottom: 16px;
			}

			.filter-btn {
				background: #e5e7eb;
				border: none;
				padding: 6px 12px;
				border-radius: 6px;
				font-size: 0.85rem;
				cursor: pointer;
				color: var(--muted);
				font-weight: 600;
			}

			.filter-btn.active {
				background: var(--primary);
				color: white;
			}

			ul {
				list-style: none;
				max-height: 300px;
				overflow-y: auto;
			}

			li {
				display: flex;
				align-items: center;
				justify-content: space-between;
				padding: 12px;
				border-bottom: 1px solid #
				f3f4f6;
				animation: fadeIn 0.25s ease;
			}

			@keyframes fadeIn {
				from {opacity: o; transform: translateY(-5px);}
				to {opacity: 1; transform: translateY(0);}
			}

			.task-text {
				flex: 1;
				cursor: pointer;
				display: flex;
				align-items: center;
				gap: 10px;
			}

			li.completed .task-text span {
				text-decoration: line-through;
				color: var(--muted);
			}

			.btn-delete {
				background: transparent;
				border: none;
				color: var(--danger);
				cursor: pointer;
				font-size: 1.1rem;
				padding: 4px 8px;
				border-radius: 4px;
			}

			.btn-delete:hover {
				background: #fee2e2;
			}

			.stats {
				margin-top: 16px;
				font-size: 0.85rem;
				color: var(--muted);
				text-align: right;
			}			
	</style>
</head>
<body>
<div class="container">
	<div class="timer-box">
		<div>waktu fokus (podomoro)</div>
		<div class="timer-display" id="timer-contols">25:00</div>
		<div class="timer-contols">
			<button onclick="startTimer()">Mulai</button>
			<button onclick="pauseTimer()">Jeda (waktunya emel)</button>
			<button onclick="resetTimer()">Mulai belajar lg</button>
		</div>
	</div>

	<h2>Daftar Tugas</h2>
	<div class="input-group">
		<input type="text" id="taskInput" placeholder="Tulis Tugas Baru...." onkeypress="handleEnter(event)">
		<button class="btn-add" onclick="addTask()">Tambahkan Ke Mylist</button>
	</div>

	<div class="filters">
		<button class="filter-btn active" onclick="setFilter('all', this)">Semua</button>
		<button class="filter-btn" onclick="setFilter('active', this)">Belum Selesai</button>
		<button class="filter-btn" onclick="setFilter('completed', this)">Selesai</button>
	</div>

	<ul id="taskList"></ul>
	<div class="stats" id="taskStats">0 tugas Tersisa</div>
</div>

<script>
	let timeLeft = 25 * 60;
	let timeInterval = null;

	function updateTimerDisplay() {
		const minutes = Math.floor(timeLeft / 60);
		const seconds = timeLeft % 60;
		document.getElementById('timerDisplay').textContent = `${string(minutes.padStart(2, '0')}:${string(seconds).padStart(2,'0')}`;
	}

	function pauseTimer() {
		if (timerInterval) return;
		timerInterval = setInterval(() => {
			if (timeLeft > 0) {
				timeLeft--;
				updateTimerDisplay();
			} else {

		    }
		  }, 1000);
		}

		function pauseTimer() {
			clearnterval(timerInterval);
			timerInterval = null;
		}

		function resetTimer() {
			pauseTimer();
			timeLeft = 25 * 60;
			updateTimerDisplay();
		}


		let tasks = JSON.parse(localStorage.getItem('mtTasks')) || [];
		let currenFilter = 'all';

		function saveTasks(); {
			localStorage.setItem('myTasks', JSON.stringify(tasks));
		}

		function addTasks() {
			const input = document.getElementById('taskInput');
			const text = input.value.trim();
			if (!text) return;

			tasks.push({
				id: Date.now(),
				text: text,
				completed: false
			});

			input.value = '';
			saveTasks();
			renderTasks();
		}

		function handleEnter(event) {
			if (event.key == 'Enter') addTasks();
		}

		function toggleTasks(id) {
			tasks = tasks.map(task =>
				task.id === id ? { ...task, completed: !tasks.completed } : task);
			saveTasks();
			renderTasks();
		}

		function deleteTask(id) {
			tasks = tasks.filter(task => task.id !== id);
			saveTasks();
			renderTasks();
		}

		function setFilter(filter, btnElement) {
			currenFilter = filter;
			document.querySelectorAll('.filter-btn').forEach(btn => btn.classList.remove('active'));
			btnElement.classList.add('active');
			renderTasks();
		}

		function renderTasks() {
			const list = document.getElementById('taskList');
			list.innerHTML = '';

			const filteredTasks = tasks.filter(task => {
				if (currenFilter === 'active') return ! task.completed;
				if (currenFilter === 'completed') return task.completed;
				return true;
			});

			filteredTasks.forEach(tasks.filter(task => {
				const li = document.createElement('li');
				if (task.completed) li.classList.add(`completed`);

				li.innerHTML = `
				<div class="tasks-text" onclick ="toggleTask(${task.id})">
				<input type="checkbox" ${task.completed ? 'checked' : ''}>
				<span>${escapeHTML(task.text)}</span>
			 	</div>
				<button class="btn-delete" onclick="deleteTask(${task.id})" title="Hapus">&Times;</button>
				`;
				list.appendChild(li);
			});

		   const remaining = tasks.filter(t => !t. completed).length;
		   document.getElementById('taskStats').textContent = `${remaining} tugas yang tersisa`;
		}

		function escapeHTML(str) {
			return str.replace(/[&<>'"]/g, tag => ({
				'&': '&amp;', '<': '&lt;', '>': '&gt;', "'": '&#39;','"': '&quot;'

			}[tag]));
		}

		renderTasks();
</script>
</body>
</html>
